version: "3.9"

services:
  energyinsight:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QWEN_API_KEY=${QWEN_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-qwen}
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      - PYPSA_ENABLED=true
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./reports:/app/reports
      - ./.env:/app/.env:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
