            - cell [ref=e75]:
              - paragraph [ref=e76]:
                - strong [ref=e79]: 国家能源局综合司关于开展新型储能试点示范工作的通知
              - paragraph [ref=e80]:
                - generic [ref=e82]: 国能综通科技[2023]77号
              - paragraph [ref=e83]: 各省（自治区、直辖市）能源局，有关省（自治区、直辖市）及新疆生产建设兵团发展改革委、工业和信息化主管部门、城市管理委，各派出机构，有关中央企业：
              - paragraph [ref=e84]: 为深入贯彻党的二十大和二十届一中全会精神，认真落实《中华人民共和国经济和社会发展第十四个五年规划和2035年远景目标纲要》《“十四五”新型储能发展实施方案》有关要求，加快推动新型储能多元化、产业化、市场化高质量发展，支持建设新型能源体系，我局拟组织开展新型储能试点示范，并制定了《新型储能试点示范工作规则（试行）》（以下简称《规则》，见附件1）。为做好示范项目遴选工作，现就有关事项通知如下。
              - paragraph [ref=e85]: 一、本次示范工作以推动新型储能多元化、产业化发展为目标，组织遴选一批典型应用场景下，在安全性、经济性等方面具有竞争潜力的各类新型储能技术示范项目。
              - paragraph [ref=e86]: 二、新型储能项目业主单位为申报单位，各省（自治区、直辖市）及新疆生产建设兵团能源主管部门、中央企业集团为推荐单位。
              - paragraph [ref=e87]: 三、请各申报单位按照《规则》要求，于2023年7月13日前将签字盖章的申报材料报送至项目所在地省级能源主管部门或所属中央企业集团。
              - paragraph [ref=e88]: 申报项目原则上为已完成备案，且预计在2024年底前投产的项目。申报项目知识产权清晰，技术先进，示范带动作用良好。
              - paragraph [ref=e89]: 四、请各省级能源主管部门、中央企业集团结合本地区、本企业实际情况，做好示范项目申报组织、初步审核、推荐工作。请于2023年8月13日前将纸质推荐材料（1套）报送至国家能源局科技司。同时，通过全国新型储能大数据平台报送电子版材料（网址：https://www.china-nes.cn）。
              - paragraph [ref=e90]: 每个推荐单位推荐项目原则上不超过3个，其中同一技术路线的项目不超过2个。
              - paragraph [ref=e91]: 五、国家能源局将组织评审确定示范项目入围名单，并纳入全国新型储能大数据平台和国家有关重大工程项目库，加强跟踪评估与宣传推广。
              - paragraph [ref=e92]: 六、推荐材料应包括书面推荐意见、相关项目申报材料、有关支持政策考虑等。材料报送请使用中国邮政EMS。报送日期以邮戳为准。
              - paragraph [ref=e93]: 邮寄地址：北京市西城区三里河路46号，邮编：100045
              - paragraph [ref=e94]: 联系方式：国家能源局科技司，010-81929227/9226，010-81929218（传真）
              - paragraph [ref=e95]: 全国新型储能大数据平台：张翼 1881030218
              - paragraph [ref=e96]: 赵伟伟 15536555498
              - paragraph [ref=e97]: 邮箱：nengxiaochuneng@nea.gov.cn
              - paragraph
              - paragraph [ref=e98]: "附件:"
