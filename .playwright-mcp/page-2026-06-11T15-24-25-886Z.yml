              - text: 针对磷酸焦磷酸铁钠正极材料电子电导率较低的问题，可采用均质高导电包覆策略以提升材料电子电导率。通过优化电极设计，构筑互穿导电网络，可使电极的电子电导率得到提升，电极的电子电导率提升3个数量级，有助于实现材料颗粒间均匀的钠离子脱嵌
              - superscript [ref=e393] [cursor=pointer]:
                - text: "[3-5]"
                - emphasis
                - emphasis
                - emphasis
              - superscript [ref=e395] [cursor=pointer]:
                - text: "[26]"
                - emphasis
              - text: 。
            - generic [ref=e396]:
              - text: 在硬碳负极方面，通过构筑孔道可提升负极嵌脱钠速率，使其支持较高倍率充电循环，负极可以实现4C倍率快充循环。硬碳负极嵌钠过程的体积膨胀较小，嵌钠过程基本上可实现~0膨胀，远小于锂离子电池石墨负极10%的膨胀，这有助于抑制因体积变化导致的界面副反应，减少电解液消耗
              - superscript [ref=e398] [cursor=pointer]:
                - text: "[3-4]"
                - emphasis
                - emphasis
              - superscript [ref=e400] [cursor=pointer]:
                - text: "[26]"
                - emphasis
              - text: 。
            - generic [ref=e401]:
              - text: 针对
              - link "钠离子电池" [ref=e403] [cursor=pointer]:
