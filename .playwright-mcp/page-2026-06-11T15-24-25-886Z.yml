              - superscript [ref=e430] [cursor=pointer]:
                - text: "[22]"
                - emphasis
              - text: ，在25℃、1P功率条件下进行充放电循环，4000次后容量保持率为94.2%；在45℃高温环境下循环4000次后容量保持率为92.5%
