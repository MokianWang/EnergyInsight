              - text: 与硬碳负极的相互作用机制，可采用微键合电解液配方以实现离子传导
              - superscript [ref=e407] [cursor=pointer]:
                - text: "[3-5]"
                - emphasis
                - emphasis
                - emphasis
              - text: 。该配方在保证钠离子电荷传递动力学的基础上，有助于降低副反应，提升电池的高温稳定性及循环寿命
              - superscript [ref=e409] [cursor=pointer]:
                - text: "[3-4]"
                - emphasis
                - emphasis
              - text: 。
