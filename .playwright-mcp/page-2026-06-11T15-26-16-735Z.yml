    - heading "关于印发《“十四五”新型储能发展实施方案》的通知" [level=1] [ref=e17]
    - generic [ref=e18]: 2022/03/21 能源局
    - generic [ref=e19]:
      - strong [ref=e22]: 国家发展改革委 国家能源局关于印发
      - strong [ref=e25]: 《“十四五”新型储能发展实施方案》的通知
      - generic [ref=e28]: 发改能源〔2022〕209号
      - text: 各省、自治区、直辖市及新疆生产建设兵团发展改革委、能源局，国家能源局各派出机构，有关中央企业：
      - text: 为深入贯彻落实“四个革命、一个合作”能源安全新战略，实现碳达峰碳中和战略目标，支撑构建新型电力系统，加快推动新型储能高质量规模化发展，根据《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》《国家发展改革委 国家能源局关于加快推动新型储能发展的指导意见》有关要求，我们组织编制了《“十四五”新型储能发展实施方案》，现印发给你们，请遵照执行。
      - generic [ref=e29]:
        - text: 国家发展改革委
        - text: 国 家 能 源 局
        - text: 2022年1月29日
